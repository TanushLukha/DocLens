# Lint, type checks and every test on each push and pull request, on a clean Linux machine.
# Tests that need downloaded data or TinyGPT's model skip themselves here; they run on the Mac.
# Every step runs through scripts/ci_step.sh: when it fails, the end of its output becomes an
# annotation, which GitHub's public API returns without signing in (the full logs need a sign in).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (FriBiDi for shaping Devanagari, Tesseract for the M1 tests, libGL and GLib for OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0 tesseract-ocr libgl1 libglib2.0-0 \
            || sudo apt-get install -y libfribidi0 tesseract-ocr libgl1 libglib2.0-0t64
      # torch and torchvision both from PyTorch's CPU index: PyPI's torchvision is built for the CUDA
      # build of PyTorch and fails to load next to the CPU build (decision 55)
      - name: Python packages, with the CPU build of PyTorch
        run: |
          bash scripts/ci_step.sh "Installing PyTorch" pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          bash scripts/ci_step.sh "Installing the package" pip install -e ".[dev,fields,service,export]"
      - name: Lint
        run: bash scripts/ci_step.sh "Lint" ruff check .
      - name: Types
        run: bash scripts/ci_step.sh "Type check" mypy
      - name: Tests
        run: bash scripts/ci_step.sh "Tests" pytest -q -rfE

  # The service's Docker image, built with tiny untrained models (the real ones are made on the Mac),
  # then checked end to end over HTTP: every step runs and every answer has its shape.
  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: libGL and GLib for OpenCV, which the end to end check imports
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 || sudo apt-get install -y libgl1 libglib2.0-0t64
      - name: Tiny models for the image
        run: |
          bash scripts/ci_step.sh "Installing PyTorch" pip install torch --index-url https://download.pytorch.org/whl/cpu
          bash scripts/ci_step.sh "Installing the package" pip install -e ".[fields,export]"
          bash scripts/ci_step.sh "Tiny models" python scripts/tiny_models.py models
      - name: Build the image
        run: |
          bash scripts/ci_step.sh "Docker build" docker build -t doclens .
          docker images doclens
      - name: Run it, and check it end to end
        run: |
          docker run -d --name doclens -p 8000:8000 doclens
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          bash scripts/ci_step.sh "End to end check" python scripts/check_service.py --url http://127.0.0.1:8000
      - name: The service's log
        if: always()
        run: docker logs doclens > service.log 2>&1 || true; cat service.log
      - name: The service's log as an annotation, when a step failed
        if: failure()
        run: python3 scripts/ci_annotate.py service.log "The service's log"
