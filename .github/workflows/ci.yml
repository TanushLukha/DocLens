# Lint, type checks and every test on each push and pull request, on a clean Linux machine.
# Tests that need downloaded data or TinyGPT's model skip themselves here; they run on the Mac.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (FriBiDi for shaping Devanagari, Tesseract for the M1 tests)
        run: sudo apt-get update && sudo apt-get install -y libfribidi0 tesseract-ocr
      - name: Python packages, with the CPU build of PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,fields,service,export]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q

  # The service's Docker image, built with tiny untrained models (the real ones are made on the Mac),
  # then checked end to end over HTTP: every step runs and every answer has its shape.
  image:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tiny models for the image
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[fields,export]"
          python scripts/tiny_models.py models
      - name: Build the image
        run: |
          docker build -t doclens .
          docker images doclens
      - name: Run it, and check it end to end
        run: |
          docker run -d --name doclens -p 8000:8000 doclens
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          python scripts/check_service.py --url http://127.0.0.1:8000
      - name: The service's log
        if: always()
        run: docker logs doclens || true
