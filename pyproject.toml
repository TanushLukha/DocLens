[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "0.1.0"
description = "Reads printed Hindi and English documents: OCR and key information extraction, built and measured from first principles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanush Lukha" }]
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "pillow>=10.1", "regex>=2023.0", "fonttools>=4.40",
                "shapely>=2.0", "rapidfuzz>=3.0"]

[project.optional-dependencies]
data = ["huggingface_hub>=0.24", "pyarrow>=14", "datasets>=2.16"]
train = ["torch>=2.6"]
track = ["mlflow>=3.17"]
lm = ["safetensors>=0.4"]
pages = ["python-doctr==1.1.0"]
fields = ["transformers==5.22.1"]
dev = ["pytest>=7", "rapidfuzz>=3.0", "ruff>=0.15", "mypy>=1.11"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E741: l is a fine name in a table; E731: short lambdas in tables; B905, B023: deliberate in M1's code
ignore = ["E741", "E731", "B905", "B023"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/doclens"]
